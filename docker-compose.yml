version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: btl_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_btl_2026
      POSTGRES_DB: btl_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
