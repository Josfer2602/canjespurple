version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: btl_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_btl_2026
      POSTGRES_DB: btl_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: btl_backend
    restart: always
    depends_on:
      - db
    environment:
      # Database URL usa el nombre del contenedor 'db'
      - DATABASE_URL=postgresql://postgres:password_btl_2026@db:5432/btl_saas?schema=public
      - NODE_ENV=production
      - FRONTEND_URL=https://canjes.simplegoapp.de
      # Importante: El resto de variables como JWT_SECRET o las de Google Drive 
      # se deben inyectar en el servidor a través de un archivo .env si no se ponen aquí
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: btl_frontend
    restart: always
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: btl_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
