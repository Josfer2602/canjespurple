version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: btl_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_btl_2026
      POSTGRES_DB: btl_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: btl_backend
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:password_btl_2026@db:5432/btl_saas?schema=public
      - NODE_ENV=production
      - FRONTEND_URL=https://canjes.simplegoapp.de
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: btl_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

